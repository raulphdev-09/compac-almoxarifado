# Review Render's current pricing before creating this paid service and disk.
services:
  - type: web
    name: compac-almoxarifado
    runtime: python
    plan: starter
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.lock
    startCommand: python -m app.serve
    healthCheckPath: /health
    disk:
      name: compac-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: COMPAC_DB
        value: /var/data/compac.db
      - key: COMPAC_COOKIE_SECURE
        value: "1"
      - key: COMPAC_TIMEZONE
        value: America/Sao_Paulo
      - key: COMPAC_SETUP_TOKEN
        generateValue: true
