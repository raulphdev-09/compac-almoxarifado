# Free web service. Durable data lives in an external free PostgreSQL project.
services:
  - type: web
    name: compac-almoxarifado
    runtime: python
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.lock
    startCommand: python -m app.serve
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_URL
        sync: false
      - key: COMPAC_REQUIRE_POSTGRES
        value: "1"
      - key: COMPAC_COOKIE_SECURE
        value: "1"
      - key: COMPAC_TIMEZONE
        value: America/Sao_Paulo
      - key: COMPAC_SETUP_TOKEN
        generateValue: true
